<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dialog Explainer Motion Starter</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #fff4e4;
        --ink: #1f2633;
        --accent: #e4572e;
        --highlight: #ffc24a;
        --card: #fffdf8;
        --wood: #b9794a;
        --wood-dark: #9a5f36;
        --dika: #2e6e80;
        --sari: #e3a23b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        font-family: "Archivo Black", sans-serif;
        color: var(--ink);
      }

      /* ---------- camera rig: #world moves (x, y, scale from 0 0), #world-fx carries focus blur ---------- */
      #viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 0 0;
      }
      #world-fx {
        position: absolute;
        inset: 0;
      }
      .wo {
        position: absolute;
      }
      #w-wall {
        left: -700px;
        top: -700px;
        width: 2480px;
        height: 2300px;
        background:
          radial-gradient(ellipse 30% 22% at 50% 40%, rgba(255, 194, 74, 0.3) 0%, rgba(255, 244, 228, 0) 70%),
          var(--paper);
      }
      #w-tiles {
        left: -700px;
        top: -700px;
        width: 2480px;
        height: 2050px;
        background-image:
          linear-gradient(rgba(185, 121, 74, 0.13) 3px, transparent 3px),
          linear-gradient(90deg, rgba(185, 121, 74, 0.13) 3px, transparent 3px);
        background-size: 120px 120px;
        background-position: 20px 0;
      }
      #w-sign {
        left: 64px;
        top: 300px;
        width: 520px;
        height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 34px;
        border-radius: 18px;
        background: var(--wood-dark);
        border: 7px solid #6b4226;
        box-shadow: 0 14px 0 rgba(107, 66, 38, 0.25);
        color: #fff4e4;
      }
      #w-sign .k {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.12em;
        color: #f7d9b5;
      }
      #w-sign .v {
        font-size: 50px;
        line-height: 1.02;
        letter-spacing: -0.02em;
      }
      #w-menu {
        left: 650px;
        top: 290px;
        width: 360px;
        height: 290px;
        padding: 26px 30px;
        border-radius: 16px;
        background: #2d3b36;
        border: 8px solid #6b4226;
        color: #f4efe4;
      }
      #w-menu .t {
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.2em;
        color: #ffd27a;
      }
      #w-menu .row {
        display: flex;
        justify-content: space-between;
        margin-top: 22px;
        font-size: 34px;
        letter-spacing: -0.01em;
      }
      #w-menu .row .p {
        color: #ffd27a;
      }
      #w-deco,
      #w-props {
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .actor {
        position: absolute;
        top: 860px;
        width: 420px;
        height: 600px;
        overflow: visible;
      }
      #dika {
        left: 40px;
      }
      #sari {
        left: 620px;
      }
      .actor .eyes {
        transform-box: fill-box;
        transform-origin: 50% 50%;
      }
      #dika-head,
      #sari-head {
        transform-box: view-box;
        transform-origin: 210px 300px;
      }
      #dika-arm-up {
        transform-box: view-box;
        transform-origin: 318px 470px;
      }
      #sari-arm-up {
        transform-box: view-box;
        transform-origin: 100px 500px;
      }
      #w-counter {
        left: -700px;
        top: 1350px;
        width: 2480px;
        height: 1100px;
        background: linear-gradient(180deg, var(--wood) 0px, var(--wood) 26px, var(--wood-dark) 26px, var(--wood-dark) 34px, #a96a3f 34px);
      }
      #w-grain {
        position: absolute;
        inset: 34px 0 0 0;
        background-image: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.05) 0 2px, transparent 2px 46px);
      }

      /* ---------- screen layer ---------- */
      .view-host {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
      }
      #scrim {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 980px;
        background: linear-gradient(180deg, rgba(255, 244, 228, 0.95) 0%, rgba(255, 244, 228, 0.86) 58%, rgba(255, 244, 228, 0) 100%);
        opacity: 0;
      }
      .frame-host {
        position: absolute;
        left: 0;
        top: 250px;
        width: 1080px;
        height: 640px;
      }
      #header {
        position: absolute;
        left: 64px;
        top: 168px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 8px 18px 8px 8px;
        border-radius: 999px;
        background: rgba(255, 244, 228, 0.92);
      }
      #header .pill {
        display: block;
        padding: 10px 22px 8px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--card);
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.08em;
      }
      #header .label {
        display: block;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 28px;
        color: var(--ink);
      }
      .caption {
        position: absolute;
        left: 64px;
        top: 1378px;
        width: 880px;
        padding: 22px 34px 26px;
        border-radius: 28px;
        background: var(--ink);
        box-shadow: 0 10px 0 rgba(31, 38, 51, 0.18);
      }
      .caption .who {
        display: inline-block;
        padding: 4px 16px 2px;
        border-radius: 10px;
        font-family: "Space Mono", monospace;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.1em;
      }
      .caption .who.dika {
        background: var(--dika);
        color: var(--card);
      }
      .caption .who.sari {
        background: var(--sari);
        color: var(--ink);
      }
      .caption .line {
        display: block;
        margin-top: 10px;
        font-size: 46px;
        line-height: 1.18;
        letter-spacing: -0.015em;
        color: var(--paper);
      }
      .caption .line .w {
        display: inline-block;
        margin: 0 0.07em;
        transform-origin: 50% 70%;
      }
      .caption .line .w.kw {
        color: var(--highlight);
      }
    </style>
  </head>

        /* CAST:BEGIN */ const CAST_LINES = []; /* CAST:END */
        // Demo cue data so the starter runs before any voice exists: build-root.mjs replaces it from
        // audio/timing.json, then lists every cue below whose line or word your script does not have.
        /* CUES:BEGIN */ const CUE_DATA = {"lines":{"f1-1-dika":{"s":1.7,"e":3.3,"w":[["eh",1.7,1.9],["ini",1.95,2.1],["sebenarnya",2.15,2.7],["gimana",2.75,3.1],["sih",3.12,3.3]]},"f1-2-sari":{"s":3.6,"e":6.15,"w":[["sini",3.6,3.92],["aku",3.98,4.12],["tunjukkan",4.16,4.62],["langsung",4.68,5.1],["di",5.3,5.42],["hp",5.65,5.95],["kamu",6,6.15]]},"f2-1-sari":{"s":6.45,"e":9.4,"w":[["lihat",6.45,6.8],["bagian",6.85,7.3],["ini",7.35,7.55],["dulu",7.6,8],["sebelum",8.35,8.8],["lanjut",8.85,9.4]]},"f3-1-sari":{"s":10.25,"e":11.8,"w":[["ingat",10.25,10.55],["tiga",10.65,10.95],["langkah",11,11.4],["ini",11.45,11.8]]},"f3-2-dika":{"s":12.1,"e":14.4,"w":[["satu",12.1,12.5],["dua",12.8,13.15],["tiga",13.45,13.8],["siap",14,14.4]]},"f4-1-dika":{"s":15.25,"e":16.2,"w":[["oke",15.25,15.6],["paham",15.7,16.2]]},"f4-2-sari":{"s":16.5,"e":18.2,"w":[["mantap",16.5,16.95],["ayo",17.1,17.35],["coba",17.4,18.2]]}},"frames":{"1":[0,6.2],"2":[6.2,10],"3":[10,15],"4":[15,20]}};
        const cue = (spec, offset = 0) => resolveCue(CUE_DATA, spec, offset);
        function resolveCue(D, spec, offset) {
          const m = /^\s*([^\s:@#]+)(?::([^\s@#]+))?(?:#(\d+))?(@end)?\s*([+-]\s*[\d.]+)?\s*$/.exec(String(spec));
          if (!m) throw new Error(`cue "${spec}": expected line[:word][#n][@end] [+-seconds]`);
          const [, id, word, nth, atEnd, off] = m;
          const shift = (off ? parseFloat(off.replace(/\s+/g, "")) : 0) + (offset || 0);
          if (id === "frame") {
            const f = D.frames[word];
            if (!f) throw new Error(`cue "${spec}": no frame ${word} (frames: ${Object.keys(D.frames).join(" ")})`);
            return +(f[atEnd ? 1 : 0] + shift).toFixed(3);
          }
          const L = D.lines[id];
          if (!L) throw new Error(`cue "${spec}": no line "${id}"`);
          if (!word) return +((atEnd ? L.e : L.s) + shift).toFixed(3);
          const key = word.toLowerCase().replace(/[^\p{L}\p{N}-]/gu, "");
          const hits = L.w.filter((w) => w[0] === key);
          const n = nth ? Number(nth) : 1;
          if (hits.length < n) throw new Error(`cue "${spec}": "${key}" ${hits.length ? `is spoken ${hits.length}x` : "is not spoken"} in ${id} (${L.w.map((w) => w[0]).join(" ")})`);
          return +(hits[n - 1][atEnd ? 2 : 1] + shift).toFixed(3);
        } /* CUES:END */
        const TOTAL = parseFloat(document.getElementById("root").dataset.duration);
        const tl = gsap.timeline({ paused: true });
        const $ = (id) => document.getElementById(id);

        // ---- Camera: each shot puts world point P at screen point Q at scale S (transform-origin 0 0). ----
        // Points of interest in world coordinates (references/kamera.md has the full set map).
        const cam = (S, P, Q) => ({ scale: S, x: Q[0] - S * P[0], y: Q[1] - S * P[1] });
        const A_PHONE = [383, 1203];
        const B_FACE = [830, 1086];
        const HERO = [540, 1250];
        const SHOTS = [
          // [time, duration (0 = cut), S, P (world), Q (screen), ease]; times are word cues (build-root.mjs)
          [0, 0, 1, [540, 960], [540, 960]],
          [0.2, 1.2, 1.06, [540, 1100], [540, 1100], "sine.inOut"], // establishing, slow push
          [cue("f1-1-dika -0.2"), 0.8, 2.0, [320, 1130], [540, 780], "power2.inOut"], // push to MCU of A
          [cue("f1-2-sari -0.1"), 0, 2.1, [B_FACE[0], 1110], [540, 760]], // cut to B
          [cue("f1-2-sari:hp -0.05"), 0, 2.4, A_PHONE, [540, 820]], // "HP": cut to A's phone
          [cue("f1-2-sari:hp"), 0.4, 7, A_PHONE, [540, 820], "power3.in"], // push through into the insert view
          [cue("frame:3"), 0, 2.6, HERO, [540, 760]], // CU of the topic prop
          [cue("f3-1-sari:tiga -0.05"), 0.8, 1.5, [540, 1150], [540, 1000], "power2.inOut"], // two-shot while the steps land
          [cue("frame:4"), 1.2, 1.22, [540, 1150], [540, 1080], "power2.inOut"], // pull back for the tagline
        ];
        for (const [t, d, S, P, Q, ease] of SHOTS) {
          const c = cam(S, P, Q);
          if (d === 0) tl.set("#world", c, t);
          else tl.to("#world", { ...c, duration: d, ease }, t);
        }
        tl.set("#world-fx", { filter: "blur(0px)" }, 0);
        // Paper scrim and faded signage so the tagline reads over the wall.
        tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, cue("frame:4 +0.3"));
        tl.fromTo(["#w-sign", "#w-menu"], { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, cue("frame:4"));
        // Hide the world while a full-screen cut-away view covers it.
        for (const [off, on] of [[cue("frame:2"), cue("frame:3")]]) {
          tl.set("#viewport", { autoAlpha: 0 }, off);
          tl.set("#viewport", { autoAlpha: 1 }, on);
        }

        // Header.
        tl.fromTo("#header .pill", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.8)" }, 0.15);
        tl.fromTo("#header .label", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.3);
        // Lamps breathe a little.
        tl.to("#w-lamps", { opacity: 0.8, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(TOTAL / 1.6) - 1) }, 0);

        // Caption cards: a quick settle as each chunk arrives.
        document.querySelectorAll(".caption").forEach((cap) => {
          tl.fromTo(cap.querySelector(".line"), { y: 12, opacity: 0.35 }, { y: 0, opacity: 1, duration: 0.16, ease: "power2.out" }, parseFloat(cap.dataset.start));
        });

        // ---- Cast: poses (expression + arm), lip-sync, blink, idle, high five ----
        const POSES = {
          dika: [
            [0, { brow: "neutral", rest: "closed", arm: "none" }],
            [cue("f1-1-dika -0.2"), { brow: "worried", rest: "frown", arm: "phone" }],
            [cue("frame:3"), { brow: "neutral", rest: "closed", arm: "none" }],
            [cue("frame:4"), { brow: "up", rest: "smile" }],
            [cue("f4-2-sari"), { arm: "up" }],
          ],
          sari: [
            [0, { brow: "neutral", rest: "closed", arm: "none" }],
            [cue("f1-2-sari -0.1"), { brow: "up", arm: "explain" }],
            [cue("f1-2-sari:kamu"), { brow: "neutral" }],
            [cue("frame:4"), { rest: "smile", arm: "none" }],
            [cue("f4-2-sari"), { brow: "up", arm: "up" }],
          ],
        };
        const PARTS = {
          dika: { brow: ["neutral", "worried", "up"], mouth: ["closed", "frown", "open", "mid", "smile"], arm: ["phone", "up"] },
          sari: { brow: ["neutral", "up"], mouth: ["closed", "open", "mid", "smile"], arm: ["explain", "up"] },
        };
        const NODES = {};
        for (const who of ["dika", "sari"]) {
          NODES[who] = { svg: $(who), head: $(who + "-head"), eyes: $(who + "-eyes"), armUp: $(who + "-arm-up") };
          for (const [part, opts] of Object.entries(PARTS[who])) for (const o of opts) NODES[who][part + ":" + o] = $(who + "-" + part + "-" + o);
        }
        function poseAt(who, t) {
          const s = {};
          let armAt = 0;
          for (const [at, change] of POSES[who]) {
            if (at > t) break;
            if (change.arm) armAt = at;
            Object.assign(s, change);
          }
          s.armAt = armAt;
          return s;
        }
        function speechAt(who, t) {
          for (const L of CAST_LINES) {
            if (L.who !== who || t < L.start - 0.03 || t > L.end + 0.03) continue;
            for (const [s, e, syl] of L.words) {
              if (t >= s && t < e) {
                const x = ((t - s) / (e - s)) * syl;
                const k = Math.floor(x);
                return { talking: true, mouth: x - k > 0.72 ? "mid" : k % 2 === 0 ? "open" : "mid" };
              }
            }
            return { talking: true, mouth: null };
          }
          return { talking: false, mouth: null };
        }
        function blinkScale(t, offset, period) {
          if (t < offset) return 1;
          const n = Math.floor((t - offset) / period);
          const tb = offset + n * period + ((n * 37) % 7) * 0.09;
          const d = t - tb;
          return d >= 0 && d < 0.15 ? 1 - 0.9 * Math.sin((Math.PI * d) / 0.15) : 1;
        }
        const enter = gsap.parseEase("power3.out");
        const pop = gsap.parseEase("back.out(1.6)");
        const clamp01 = (v) => Math.max(0, Math.min(1, v));
        const CAST = {
          dika: { enterAt: 0.05, bobPhase: 0, blink: [1.3, 3.4], upSign: 1 },
          sari: { enterAt: 0.2, bobPhase: 1.7, blink: [2.2, 3.9], upSign: -1 },
        };
        function renderCast(t) {
          for (const who of ["dika", "sari"]) {
            const n = NODES[who];
            const c = CAST[who];
            const pose = poseAt(who, t);
            const sp = speechAt(who, t);
            const mouth = sp.mouth || pose.rest;
            for (const o of PARTS[who].brow) n["brow:" + o].setAttribute("opacity", pose.brow === o ? 1 : 0);
            for (const o of PARTS[who].mouth) n["mouth:" + o].setAttribute("opacity", mouth === o ? 1 : 0);
            for (const o of PARTS[who].arm) n["arm:" + o].setAttribute("opacity", pose.arm === o ? 1 : 0);
            if (pose.arm === "up") {
              const p = clamp01((t - pose.armAt) / 0.45);
              n.armUp.style.transform = "rotate(" + c.upSign * 55 * (1 - pop(p)) + "deg)";
            }
            const rise = 140 * (1 - enter(clamp01((t - c.enterAt) / 0.8)));
            const bob = Math.sin((t / 3.2) * Math.PI * 2 + c.bobPhase) * 2.5;
            n.svg.style.transform = "translateY(" + (rise + bob).toFixed(2) + "px)";
            const tilt = sp.talking ? Math.sin(t * 2 * Math.PI * 1.4 + c.bobPhase) * 1.6 : 0;
            n.head.style.transform = "rotate(" + tilt.toFixed(2) + "deg)";
            n.eyes.style.transform = "scaleY(" + blinkScale(t, c.blink[0], c.blink[1]).toFixed(3) + ")";
          }
        }

        // Karaoke captions: upcoming words dim, the spoken word swells, keywords keep the highlight.
        const CAP_WORDS = Array.from(document.querySelectorAll(".caption .w")).map((w) => {
          const cap = w.closest(".caption");
          const capStart = parseFloat(cap.dataset.start);
          return { node: w, s: parseFloat(w.dataset.s), e: parseFloat(w.dataset.e), kw: w.classList.contains("kw"), capStart, capEnd: capStart + parseFloat(cap.dataset.duration) };
        });
        function renderCaptions(t) {
          for (const w of CAP_WORDS) {
            if (t < w.capStart || t > w.capEnd) continue;
            let env = 0;
            if (t >= w.s && t < w.e) env = Math.min((t - w.s) / 0.08, 1);
            else if (t >= w.e) env = Math.max(0, 1 - (t - w.e) / 0.25);
            w.node.style.opacity = t < w.s ? "0.45" : "1";
            w.node.style.transform = "scale(" + (1 + 0.08 * env).toFixed(3) + ")";
            w.node.style.textShadow = env > 0 ? "0 0 " + (16 * env).toFixed(1) + "px " + (w.kw ? "rgba(255,194,74," : "rgba(255,244,228,") + (0.55 * env).toFixed(2) + ")" : "none";
          }
        }

        const drv = { t: 0 };
        const render = (t) => {
          renderCast(t);
          renderCaptions(t);
        };
        tl.to(drv, { t: TOTAL, duration: TOTAL, ease: "none", onUpdate: () => render(drv.t) }, 0);
        render(0);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
